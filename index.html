<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta http-equiv="refresh" content="3; url=https://music.youtube.com/playlist?list=PLbvStWPUS3JpTc_2t8U12eMvP1Mt6WgLY&si=t3YtnAF5dHaqYkwZ" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Inter', sans-serif;
        background: #000;
        animation: pulseGlow 6s ease-in-out infinite;
        color: white;
        text-align: center;
        overflow: hidden;
      }

      h1 {
        position: relative;
        font-size: 2.2em;
        font-weight: 700;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        opacity: 0;
        animation: fadeIn 0.5s ease-in forwards;
      }
      
      .typing-text::after {
        content: '|';
        display: inline-block;
        animation: blink-caret 0.75s step-end infinite;
      }
      
      .spinner {
        margin-top: 80px;
        width: 80px;
        height: 80px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .spinner .ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 4px solid transparent;
        border-top-color: #ff4d4d;
        border-radius: 50%;
        animation: spin 1.5s linear infinite;
      }

      .spinner .ring:nth-child(2) {
        border-top-color: #66e0ff;
        animation-delay: 0.5s;
      }

      .spinner .ring:nth-child(3) {
        border-top-color: #ff99cc;
        animation-delay: 1s;
      }

      .spinner .center-note {
        font-size: 2em;
        color: rgba(255, 255, 255, 0.3);
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        position: absolute;
      }

      .music-note {
        position: absolute;
        font-size: 2em;
        opacity: 0;
        animation: flyAndFadeOut 5s linear forwards;
        color: rgba(255, 255, 255, 0.7);
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      .bubble {
        position: absolute;
        width: 20px;
        height: 20px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        opacity: 0;
        animation: bubbleRise 5s linear forwards;
      }

      p {
        margin-top: 20px;
        font-size: 1em;
        font-weight: 500;
      }
      
      a {
        color: #fff;
        font-weight: bold;
        text-decoration: none;
        padding: 5px 10px;
        border-radius: 5px;
        transition: background 0.3s ease, transform 0.3s ease;
      }
      
      a:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }

      @keyframes pulseGlow {
        0% { background-color: #1a1a1a; box-shadow: 0 0 20px rgba(255, 77, 77, 0.5); }
        33% { background-color: #1a2b3c; box-shadow: 0 0 20px rgba(102, 224, 255, 0.5); }
        66% { background-color: #2b1a3c; box-shadow: 0 0 20px rgba(255, 153, 204, 0.5); }
        100% { background-color: #1a1a1a; box-shadow: 0 0 20px rgba(255, 77, 77, 0.5); }
      }

      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(-20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes blink-caret {
        from, to { border-color: transparent; }
        50% { border-color: white; }
      }
      
      @keyframes flyAndFadeOut {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        10% { opacity: 1; }
        100% { transform: translate(var(--x), var(--y)) scale(1); opacity: 0; }
      }

      @keyframes bubbleRise {
        0% { transform: translateY(0); opacity: 0.7; }
        100% { transform: translateY(-80vh) scale(1.2); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <h1 class="typing-text"></h1>
    <div class="spinner">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <i class="fas fa-music center-note"></i>
    </div>
    <p>Nếu không được chuyển hướng thì bấm 
      <a href="https://music.youtube.com/playlist?list=PLbvStWPUS3JpTc_2t8U12eMvP1Mt6WgLY&si=t3YtnAF5dHaqYkwZ">dô đây</a>
    </p>

    <script>
      const text = "Đang chuyển hướng, chờ xíu...";
      const typingText = document.querySelector('.typing-text');
      let i = 0;
      
      function typeWriter() {
        if (i < text.length) {
          typingText.innerHTML += text.charAt(i);
          i++;
          setTimeout(typeWriter, 50);
        } else {
          typingText.classList.remove('typing-text');
        }
      }
      
      function createMusicNote() {
        const note = document.createElement('i');
        note.className = 'fas fa-music music-note';
        document.body.appendChild(note);
        
        const startX = Math.random() * window.innerWidth;
        const startY = Math.random() * window.innerHeight;
        
        note.style.left = startX + 'px';
        note.style.top = startY + 'px';
        
        const endX = Math.random() * window.innerWidth;
        const endY = -100;
        
        note.style.setProperty('--x', (endX - startX) + 'px');
        note.style.setProperty('--y', (endY - startY) + 'px');
        
        note.addEventListener('animationend', () => {
          note.remove();
        });
      }

      function createBubble() {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        document.body.appendChild(bubble);
        
        const startX = Math.random() * window.innerWidth;
        bubble.style.left = startX + 'px';
        bubble.style.bottom = '0';
        
        bubble.addEventListener('animationend', () => {
          bubble.remove();
        });
      }
      
      setInterval(createMusicNote, 1500);
      setInterval(createBubble, 1000);
      
      typeWriter();
    </script>
  </body>
</html>
